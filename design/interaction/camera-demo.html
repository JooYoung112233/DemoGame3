<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Live49 · 연출 01</title>
<style>*{box-sizing:border-box}body{margin:0;background:#111714;color:#eee9db;font-family:system-ui,sans-serif}main{max-width:1100px;margin:auto;padding:28px 20px}small{color:#b6bea9;letter-spacing:2px}h1{font-size:25px;font-weight:500}p{color:#bfc4ba;line-height:1.7}.screen{position:relative;aspect-ratio:16/9;overflow:hidden;background:#000;border-radius:6px}.screen img{width:100%;height:100%;object-fit:cover;display:block;transform-origin:0 0;will-change:transform}.caption{position:absolute;bottom:0;left:0;right:0;padding:35px 24px 20px;background:linear-gradient(transparent,#000b);font-size:19px;opacity:0;transition:opacity .4s}.caption.show{opacity:1}nav{display:flex;flex-wrap:wrap;gap:10px;margin-top:18px}button{background:#29372e;color:#eee9db;border:1px solid #56614f;border-radius:6px;padding:12px 18px;font-size:15px;cursor:pointer}button:hover{background:#3d5141}button:focus-visible{outline:3px solid #d8c58f}#state{margin:16px 0 0;color:#e0ca98}.note{font-size:13px}label{display:block;margin-top:15px}</style>
<main><small>LIVE49 · 연출 예시 01</small><h1>같은 그림, 가까워지는 시선</h1><p>전체 공간에서 두 사람의 식탁으로 다가갑니다. 새로운 사진으로 바뀌지 않습니다.</p><div class="screen"><img id="scene" src="../../art/chapter01/01-camper-evening/camper-drawing-v2.png" alt="캠핑카 식탁에서 그림을 그리는 소이와 수혁"><div class="caption" id="caption">소이　“아빠, 이것 좀 봐.”</div></div><div id="state" aria-live="polite">전체 구도 · 재생을 눌러보세요</div><nav><button id="play">▶ 연출 재생</button><button id="wide">전체 보기</button><button id="close">식탁 확대</button><button id="pause">일시정지</button></nav><label><input type="checkbox" id="reduce"> 움직임 줄이기</label><p class="note">기존 챕터 1 시안으로 만든 카메라 동작 예제입니다. 챕터 0 장면이 아니며, 인물은 움직이지 않습니다. 확대 시 원본의 선명도 한계도 그대로 보입니다. 대사는 예시입니다.</p></main>
<script>
const scene=document.querySelector('#scene'), caption=document.querySelector('#caption'),state=document.querySelector('#state'),reduce=document.querySelector('#reduce');let animation=null;
reduce.checked=matchMedia('(prefers-reduced-motion: reduce)').matches;
const wide='translate(0%, 0%) scale(1)',close='translate(-83.4%, -59%) scale(2.3)';
function stop(){if(animation){animation.cancel();animation=null;}document.querySelector('#pause').textContent='일시정지';}
function setView(zoom){stop();scene.style.transform=zoom?close:wide;caption.classList.toggle('show',zoom);state.textContent=zoom?'식탁 확대 · 동일한 원본 이미지':'전체 구도';}
document.querySelector('#wide').onclick=()=>setView(false);document.querySelector('#close').onclick=()=>setView(true);
document.querySelector('#play').onclick=()=>{stop();if(reduce.checked){setView(true);return;}scene.style.transform=wide;caption.classList.add('show');state.textContent='전체 → 식탁으로 접근 → 잠시 머물기 → 전체';animation=scene.animate([{transform:wide,offset:0},{transform:wide,offset:.12},{transform:close,offset:.48},{transform:close,offset:.7},{transform:wide,offset:1}],{duration:9500,easing:'ease-in-out',fill:'forwards'});animation.onfinish=()=>{caption.classList.remove('show');state.textContent='재생 완료 · 같은 그림 한 장의 확대와 이동입니다';};};
document.querySelector('#pause').onclick=()=>{if(!animation||animation.playState==='finished')return;const paused=animation.playState==='paused';paused?animation.play():animation.pause();document.querySelector('#pause').textContent=paused?'일시정지':'계속 재생';};reduce.onchange=()=>setView(false);
</script></html>

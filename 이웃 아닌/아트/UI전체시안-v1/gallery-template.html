<!doctype html>
<html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>demo5 · 인게임 UI 시안</title>
<style>
:root{color-scheme:dark;font-family:'Malgun Gothic',sans-serif;background:#152121;color:#e4ddcb}*{box-sizing:border-box}body{margin:0}header{padding:36px max(24px,5vw) 20px;border-bottom:1px solid #40504a;background:#1c2a29}h1{font-size:30px;margin:8px 0 12px}p{color:#bec6bd;line-height:1.7}header p{max-width:1000px}.label{color:#d5b87c;font-size:13px;letter-spacing:2px}nav{display:flex;gap:8px;flex-wrap:wrap;margin:20px 0 12px}button,input{font:inherit}button{cursor:pointer;background:#263b36;color:#eee5d1;border:1px solid #526459;border-radius:5px;padding:10px 16px}button:hover,button.active{background:#d3bd88;color:#202924}input{background:#14201e;border:1px solid #59665b;color:#ede6d5;padding:12px;width:340px;max-width:100%;border-radius:4px}main{padding:24px max(24px,5vw) 64px}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:24px}.card{border:1px solid #3e5148;background:#1c2926;border-radius:8px;overflow:hidden}.card>button{display:block;width:100%;border:0;padding:0;border-radius:0;background:#111b18}.card img{width:100%;display:block;aspect-ratio:16/9;object-fit:contain}.body{padding:17px 20px}.body h2{font-size:19px;margin:0 0 10px}.body p{margin:0 0 12px;font-size:13px}.body a{font-size:13px;margin-right:18px;color:#dac590}a{color:#dac590}small{color:#aabcad}dialog{padding:18px;border:1px solid #637168;border-radius:8px;background:#101917;color:#f4eedf;width:min(97vw,1700px);max-width:97vw}dialog::backdrop{background:#000d}dialog img{display:block;width:100%;max-height:79vh;object-fit:contain}.controls{display:flex;justify-content:space-between;align-items:center;gap:12px;padding-bottom:12px}.controls span{flex:1;text-align:center}.note{border-left:3px solid #d3bd88;padding-left:14px;font-size:13px}#count{margin:0 0 18px}@media(max-width:800px){.grid{grid-template-columns:1fr}h1{font-size:24px}.controls span{font-size:13px}}
</style>
<header><div class="label">DEMO5 · UI REVIEW · V1</div><h1>거점에서 원정, 귀환까지</h1><p>승인한 종이 질감과 오브젝트 중심 조작을 바탕으로 만든 인게임 UI 시안입니다. 개별 가방, 원정 준비, 다인원 담당자 선택과 부족·확인 상태를 함께 검토합니다.</p><p class="note">평면 이미지로 만든 검토본입니다. 게임 기능·프리팹·PSD가 아니며 수치와 배경·초상은 예시입니다. 실제 연결과 상태는 <a href="설계기준.md">설계 기준</a> 및 <a href="화면흐름과상태.md">화면 흐름</a>을 따릅니다.</p><nav id="filters"></nav><input id="search" placeholder="화면 검색 — 가방, 수색, 전투…" aria-label="화면 검색"></header>
<main><p id="count"></p><section id="cards" class="grid"></section></main>
<dialog id="viewer"><div class="controls"><button id="prev" aria-label="이전 시안">← 이전</button><span id="caption"></span><button id="next" aria-label="다음 시안">다음 →</button><button id="close">닫기 ×</button></div><img id="full" alt=""><p id="detail"></p></dialog>
<script>
const data=/*MANIFEST*/;
let group='전체',filtered=data,index=0;
const filters=document.querySelector('#filters'),cards=document.querySelector('#cards'),viewer=document.querySelector('#viewer');
for(const label of ['전체',...new Set(data.map(x=>x.group))]){const b=document.createElement('button');b.textContent=label;b.className=label===group?'active':'';b.onclick=()=>{group=label;[...filters.children].forEach(x=>x.classList.toggle('active',x.textContent===label));render()};filters.append(b)}
function render(){const term=document.querySelector('#search').value.trim();filtered=data.filter(x=>(group==='전체'||x.group===group)&&`${x.title} ${x.slug} ${x.group}`.includes(term));cards.replaceChildren();document.querySelector('#count').textContent=`${filtered.length}개 시안 · 이미지를 누르면 확대 / 방향키로 이전·다음`;
for(const [i,x] of filtered.entries()){const el=document.createElement('article');el.className='card';const b=document.createElement('button');b.setAttribute('aria-label',x.title+' 확대');const im=document.createElement('img');im.src=x.file;im.alt=x.title;im.loading='lazy';b.append(im);b.onclick=()=>{index=i;show();viewer.showModal()};const body=document.createElement('div');body.className='body';const h=document.createElement('h2');h.textContent=x.id+' · '+x.title;const p=document.createElement('p');p.textContent=x.group+' · '+(x.width?x.width+'×'+x.height+' · ':'')+(x.qa||'배치 검토 시안');const a=document.createElement('a');a.href=x.file;a.textContent='원본 PNG';a.target='_blank';const pr=document.createElement('a');pr.href=x.id+'-'+x.slug+'-prompt.txt';pr.textContent='생성 프롬프트';body.append(h,p,a,pr);el.append(b,body);cards.append(el)}}
function show(){const x=filtered[index];document.querySelector('#full').src=x.file;document.querySelector('#full').alt=x.title;document.querySelector('#caption').textContent=x.id+' · '+x.title;document.querySelector('#detail').textContent=x.qa||'검토용 단일 이미지. UI 문구와 수치는 예시입니다.'}
function move(n){if(filtered.length){index=(index+n+filtered.length)%filtered.length;show()}}
document.querySelector('#search').oninput=render;document.querySelector('#prev').onclick=()=>move(-1);document.querySelector('#next').onclick=()=>move(1);document.querySelector('#close').onclick=()=>viewer.close();document.addEventListener('keydown',e=>{if(!viewer.open)return;if(e.key==='ArrowRight')move(1);if(e.key==='ArrowLeft')move(-1)});viewer.addEventListener('click',e=>{if(e.target===viewer)viewer.close()});render();
</script></html>

<!doctype html><html lang="ko"><head><meta charset="utf-8"><base href="/design/title/"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Live49 · 시작 화면 배경 비교</title><link rel="stylesheet" href="title.css"><style>body{min-height:100svh;display:flex;flex-direction:column;background:#0c0e0b;font-family:system-ui,sans-serif}.review-bar{padding:16px 24px;display:flex;align-items:center;gap:18px;flex-wrap:wrap;background:#181c16;border-bottom:1px solid #343b2f}.review-bar h1{font-size:15px;margin:0;letter-spacing:.05em;font-weight:500}.variants{display:flex;gap:6px}.variants button,.toggle{border:1px solid #46503e;border-radius:4px;background:transparent;color:#bec4b2;padding:9px 15px;font-size:13px}.variants button[aria-pressed=true]{background:#b7a278;color:#171c13;border-color:#b7a278}.toggle{margin-left:auto}.viewport{flex:1;min-height:0;display:grid;place-items:center;padding:16px}#title{width:min(100%,calc((100svh - 176px)*16/9));aspect-ratio:16/9;font-family:Live49Serif,serif}.review-footer{padding:0 24px 18px;font-size:12px;line-height:1.8;color:#9da591}.review-footer a{color:#d7c393}.only-art .title-menu,.only-art .title-footer{visibility:hidden}.only-art .title-shade{display:none}#event{color:#d8ba86}.review-footer p{margin:0}@media(max-width:650px){.viewport{padding:8px}#title{width:100%}.review-bar{padding:12px;gap:10px}.toggle{margin-left:0}.review-footer{padding:8px 12px}.variants button{padding:8px}.review-bar h1{width:100%}}</style></head><body>
<header class="review-bar"><h1>시작 화면 · 배경 비교</h1><div class="variants" aria-label="배경 선택"><button data-bg="a" aria-pressed="true">A · 따뜻한 빛</button><button data-bg="b" aria-pressed="false">B · 펼치기 전</button><button data-bg="c" aria-pressed="false">C · 남은 불빛</button></div><button class="toggle" aria-pressed="false">배경만 보기</button></header>
<main class="viewport"><section id="title"></section></main>
<footer class="review-footer"><p>배경 PNG / 투명 로고 / 메뉴 글씨는 각각 분리되어 있습니다. 위 비교 도구는 게임 화면에 포함되지 않습니다.</p><p><a id="download" href="../../art/title/background-a-v2.png" download>현재 배경 원본</a> &nbsp;·&nbsp; <a href="../../art/title/logo-v1.svg" download>투명 로고 SVG</a> &nbsp;·&nbsp; <a href="../../art/title/logo-v1.png" download>투명 로고 PNG</a> &nbsp;·&nbsp; <span id="event" role="status">메뉴 조작 가능 · 본편 연결 전</span></p></footer>
<script type="module">import{mountTitle}from'./title-screen.js';const status=document.querySelector('#event');const title=mountTitle(document.querySelector('#title'),{onStart:()=>{status.textContent='시작 입력 확인 · 본편 장면을 연결할 지점입니다.';},onQuit:()=>{status.textContent='종료 입력 확인 · 게임에서는 애플리케이션 종료에 연결합니다.';},onSettingsChange:()=>{}});document.querySelectorAll('[data-bg]').forEach(button=>button.addEventListener('click',()=>{title.setBackground(button.dataset.bg);document.querySelectorAll('[data-bg]').forEach(b=>b.setAttribute('aria-pressed',String(b===button)));document.querySelector('#download').href='../../art/title/background-'+button.dataset.bg+'-v2.png';}));document.querySelector('.toggle').addEventListener('click',event=>{const on=document.querySelector('#title').classList.toggle('only-art');event.currentTarget.setAttribute('aria-pressed',String(on));event.currentTarget.textContent=on?'글씨 함께 보기':'배경만 보기';});</script></body></html>

<!doctype html><meta charset="utf-8"><title>검사 남향 모션 검수</title><style>body{background:#293139;color:#eee;font:16px sans-serif;margin:16px}canvas{width:min(80vh,90vw);display:block}button{margin-right:8px}</style><p>1 대기 · 2 걷기 · 3 달리기 · 4 공격 / 상태를 바꿔 연결 확인</p><p><button onclick="ctrl.set('idle')">대기</button><button onclick="ctrl.set('walk')">걷기</button><button onclick="ctrl.set('run')">달리기</button><button onclick="ctrl.set('attack')">공격</button></p><canvas id="art" width="900" height="900"></canvas><script src="rig.js"></script><script>const regions={"head":{"source":"head","rect":[5,15,1239,1238]},"torso":{"source":"torso","rect":[31,130,963,1155]},"leftArm":{"source":"arms","rect":[51,132,355,1064]},"rightArm":{"source":"arms","rect":[622,136,378,1064]},"leftLeg":{"source":"legs","rect":[68,98,363,1221]},"rightLeg":{"source":"legs","rect":[594,98,362,1221]},"sword":{"source":"sword","rect":[342,29,340,1477]}};const imgs={};let ctrl;Promise.all(["head","torso","arms","legs","sword"].map(async n=>{const im=new Image();im.src='sources/'+n+'.png';await im.decode();imgs[n]=im})).then(()=>{const rig=new SouthRig.Rig(imgs,regions),ctx=art.getContext('2d');ctrl=new SouthRig.Controller();document.onkeydown=e=>{const states={1:'idle',2:'walk',3:'run',4:'attack'};if(states[e.key])ctrl.set(states[e.key])};let prev=performance.now();function draw(now){const dt=Math.min(.05,(now-prev)/1000);prev=now;rig.draw(ctx,ctrl.step(dt),{size:900,background:'#293139',shadow:true});requestAnimationFrame(draw)}requestAnimationFrame(draw)})</script>
